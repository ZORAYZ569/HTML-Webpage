<!DOCTYPE html>
<html>
<head>
    <title>Welcome Page</title>
</head>
<body>
    <h1>Welcome to My Webpage!</h1>
    <p id="date"></p>

    <script>
        let today = new Date();
        document.getElementById("date").innerHTML =
            "Current Date: " + today.toDateString();
    </script>
</body>
</html>
